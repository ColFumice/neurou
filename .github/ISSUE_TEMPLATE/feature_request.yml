name: Feature request
description: Propose a language, runtime, GUI or game-platform change
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        New DSL or runtime features should first be discussed as a design boundary.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not express today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Concrete syntax, behavior, and compatibility impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - DSL / compiler
        - runtime / engine
        - GUI / tuner
        - game platform
        - CLI
        - docs
        - other
