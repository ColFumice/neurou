name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Check / Test / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check core
        run: pnpm check

      - name: Type check GUI
        run: pnpm check:gui

      - name: Docs links
        run: pnpm check:docs

      - name: Game manifest
        run: pnpm check:games

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
